enable
configure terminal
hostname HQ-DSW3

no ip domain-lookup
ip routing

! VLANs
vlan 10
 name Management
vlan 20
 name Data
vlan 30
 name Servers
vlan 99
 name Native

! Uplink to HQ-CR1 (routed)
interface Ethernet2/0
 no switchport
 ip address 10.1.1.10 255.255.255.252
 no shutdown
 description Uplink-to-HQ-CR1

! Uplink to HQ-CR2 (routed)
interface Ethernet2/1
 no switchport
 ip address 10.1.1.26 255.255.255.252
 no shutdown
 description Uplink-to-HQ-CR2

! EtherChannel toward HQ-DSW4
interface Ethernet0/0
 no switchport
 channel-group 1 mode active
 no shutdown

interface Ethernet0/1
 no switchport
 channel-group 1 mode active
 no shutdown

interface port-channel 1
 no switchport
 ip address 10.1.3.1 255.255.255.252
 no shutdown
 description EtherChannel-to-HQ-DSW4

! Trunk downlinks to Access Switches
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW4

interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW5

interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW6

! SVI interfaces
interface Vlan10
 ip address 10.1.10.6 255.255.255.0
 no shutdown
 description Management-SVI
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 priority 110
 standby 10 preempt

interface Vlan20
 ip address 10.1.20.6 255.255.255.0
 no shutdown
 description Data-SVI
 standby version 2
 standby 20 ip 10.1.20.1
 standby 20 priority 110
 standby 20 preempt

interface Vlan30
 ip address 10.1.30.6 255.255.255.0
 no shutdown
 description Servers-SVI
 standby version 2
 standby 30 ip 10.1.30.1
 standby 30 priority 110
 standby 30 preempt
 exit

! OSPF
router ospf 1
 router-id 111.111.111.3
 network 10.1.1.8 0.0.0.3 area 0
 network 10.1.1.24 0.0.0.3 area 0
 network 10.1.3.0 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 passive-interface Ethernet1/0
 passive-interface Ethernet1/1
 passive-interface Ethernet1/2
 exit

! STP
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 4096
spanning-tree vlan 20 priority 4096
spanning-tree vlan 30 priority 4096
exit

! SSH
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024

enable secret cisco123

line console 0
 password cisco123
 login

line vty 0 4
 login local
 transport input ssh

end
write memory