enable
configure terminal
hostname HQ-CR1

no ip domain-lookup

! WAN interface toward ISP002
interface ethernet1/1
 ip address 100.0.2.2 255.255.255.252
 no shutdown
 description WAN-Link-to-ISP002

! Leased line toward Branch A
interface ethernet1/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
 description Leased-Line-to-BranchA

interface ethernet1/2
 ip address 10.1.0.1 255.255.255.252
 no shutdown
 description Link1-to-HQ-CR2

interface ethernet1/3
 ip address 10.1.0.5 255.255.255.252
 no shutdown
 description Link2-to-HQ-CR2

! Links to Distribution Switches
interface ethernet0/0
 ip address 10.1.1.1 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW1

interface ethernet0/1
 ip address 10.1.1.5 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW2

interface ethernet0/2
 ip address 10.1.1.9 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW3

interface ethernet0/3
 ip address 10.1.1.13 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW4

! OSPF
router ospf 1
 router-id 11.11.11.11
 network 10.1.0.0 0.0.0.3 area 0
 network 10.1.0.4 0.0.0.3 area 0
 network 10.1.1.0 0.0.0.3 area 0
 network 10.1.1.4 0.0.0.3 area 0
 network 10.1.1.8 0.0.0.3 area 0
 network 10.1.1.12 0.0.0.3 area 0
 network 10.0.12.0 0.0.0.3 area 0
 
 passive-interface ethernet1/1
 default-information originate

! Default route toward ISP002
ip route 0.0.0.0 0.0.0.0 100.0.2.1

! SSH
ip domain-name enterprise.local
crypto key generate rsa modulus 1024
ip ssh version 2
username admin privilege 15 secret cisco123

enable secret cisco123

line console 0
 password cisco123
 login

line vty 0 4
 login local
 transport input ssh

end
write memory





! IPsec VPN - HQ to Branch A
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key Enterprise@123 address 100.0.1.2
!
crypto ipsec transform-set TS-ENTERPRISE esp-aes 256 esp-sha256-hmac
 mode tunnel
!
ip access-list extended VPN-HQ-TO-BRANCHA
 permit ip 10.1.0.0 0.0.255.255 10.2.0.0 0.0.255.255
!
crypto map CMAP 10 ipsec-isakmp
 set peer 100.0.1.2
 set transform-set TS-ENTERPRISE
 match address VPN-HQ-TO-BRANCHA
!
interface Ethernet1/1
 crypto map CMAP
!