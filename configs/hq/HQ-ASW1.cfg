enable
configure terminal
hostname HQ-ASW1

no ip domain-lookup

! VLANs
vlan 10
 name Management
vlan 20
 name Data
vlan 30
 name Servers
vlan 99
 name Native

! Uplink to DSW1 - Trunk
interface Ethernet0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Uplink-to-HQ-DSW1

! Uplink to DSW2 - Trunk
interface Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Uplink-to-HQ-DSW2

! Access ports for end users - VLAN 20
interface Ethernet0/2
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
 description Access-Port-Data

interface Ethernet0/3
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
 description Access-Port-Data

! Management SVI
interface Vlan10
 ip address 10.1.10.11 255.255.255.0
 no shutdown
 description Management-SVI

! Default gateway toward DSW HSRP VIP
ip default-gateway 10.1.10.1

! STP
spanning-tree mode rapid-pvst

! SSH
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024

enable secret cisco123

line console 0
 password cisco123
 login

line vty 0 4
 login local
 transport input ssh

end
write memory