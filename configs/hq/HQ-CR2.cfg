enable
configure terminal
hostname HQ-CR2

no ip domain-lookup

! WAN interface toward ISP003
interface ethernet1/1
 ip address 100.0.3.2 255.255.255.252
 no shutdown
 description WAN-Link-to-ISP003

! Leased line toward Branch B
interface ethernet1/0
 ip address 10.0.13.1 255.255.255.252
 no shutdown
 description Leased-Line-to-BranchB

interface ethernet1/2
 ip address 10.1.0.2 255.255.255.252
 no shutdown
 description Link1-to-HQ-CR1

interface ethernet1/3
 ip address 10.1.0.6 255.255.255.252
 no shutdown
 description Link2-to-HQ-CR1

! Links to Distribution Switches
interface ethernet0/0
 ip address 10.1.1.17 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW1

interface ethernet0/1
 ip address 10.1.1.21 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW2

interface ethernet0/2
 ip address 10.1.1.25 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW3

interface ethernet0/3
 ip address 10.1.1.29 255.255.255.252
 no shutdown
 description Link-to-HQ-DSW4

! OSPF
router ospf 1
 router-id 22.22.22.22
 network 10.1.0.0 0.0.0.3 area 0
 network 10.1.0.4 0.0.0.3 area 0
 network 10.1.1.16 0.0.0.3 area 0
 network 10.1.1.20 0.0.0.3 area 0
 network 10.1.1.24 0.0.0.3 area 0
 network 10.1.1.28 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 passive-interface ethernet1/1
 default-information originate always

! Floating default route toward ISP003 (backup)
ip route 0.0.0.0 0.0.0.0 100.0.3.1 10

! SSH
ip domain-name enterprise.local
crypto key generate rsa modulus 1024
ip ssh version 2
username admin privilege 15 secret cisco123

enable secret cisco123

line console 0
 password cisco123
 login

line vty 0 4
 login local
 transport input ssh

end
write memory





! IPsec VPN - HQ to Branch B
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key Enterprise@123 address 100.0.4.2
!
crypto ipsec transform-set TS-ENTERPRISE esp-aes 256 esp-sha256-hmac
 mode tunnel
!
ip access-list extended VPN-HQ-TO-BRANCHB
 permit ip 10.1.0.0 0.0.255.255 10.3.0.0 0.0.255.255
!
crypto map CMAP 10 ipsec-isakmp
 set peer 100.0.4.2
 set transform-set TS-ENTERPRISE
 match address VPN-HQ-TO-BRANCHB
!
interface Ethernet1/1
 crypto map CMAP
!