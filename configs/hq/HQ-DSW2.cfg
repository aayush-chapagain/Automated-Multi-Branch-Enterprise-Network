enable
configure terminal
hostname HQ-DSW2

no ip domain-lookup
ip routing

! VLANs
vlan 10
 name Management
vlan 20
 name Data
vlan 30
 name Servers
vlan 99
 name Native

! Uplink to HQ-CR1 (routed)
interface Ethernet2/0
 no switchport
 ip address 10.1.1.6 255.255.255.252
 no shutdown
 description Uplink-to-HQ-CR1

! Uplink to HQ-CR2 (routed)
interface Ethernet2/1
 no switchport
 ip address 10.1.1.22 255.255.255.252
 no shutdown
 description Uplink-to-HQ-CR2

! EtherChannel toward HQ-DSW1
interface Ethernet0/0
 no switchport
 channel-group 1 mode active
 no shutdown

interface Ethernet0/1
 no switchport
 channel-group 1 mode active
 no shutdown

interface port-channel 1
 no switchport
 ip address 10.1.2.2 255.255.255.252
 no shutdown
 description EtherChannel-to-HQ-DSW1

! Trunk downlinks to Access Switches
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW1

interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW2

interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-HQ-ASW3

! SVI interfaces
interface Vlan10
 ip address 10.1.10.3 255.255.255.0
 no shutdown
 description Management-SVI
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 priority 90
 standby 10 preempt

interface Vlan20
 ip address 10.1.20.3 255.255.255.0
 no shutdown
 description Data-SVI
 standby version 2
 standby 20 ip 10.1.20.1
 standby 20 priority 90
 standby 20 preempt

interface Vlan30
 ip address 10.1.30.3 255.255.255.0
 no shutdown
 description Servers-SVI
 standby version 2
 standby 30 ip 10.1.30.1
 standby 30 priority 90
 standby 30 preempt

! OSPF
router ospf 1
 router-id 111.111.111.2
 network 10.1.1.4 0.0.0.3 area 0
 network 10.1.1.20 0.0.0.3 area 0
 network 10.1.2.0 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 passive-interface Ethernet1/0
 passive-interface Ethernet1/1
 passive-interface Ethernet1/2

! STP
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 8192
spanning-tree vlan 20 priority 8192
spanning-tree vlan 30 priority 8192

! SSH
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024

enable secret cisco123

line console 0
 password cisco123
 login

line vty 0 4
 login local
 transport input ssh

end
write memory











enable
configure terminal

ip dhcp excluded-address 10.1.20.1 10.1.20.130
ip dhcp excluded-address 10.1.30.1 10.1.30.130

ip dhcp pool HQ-DATA
 network 10.1.20.0 255.255.255.0
 default-router 10.1.20.1
 dns-server 8.8.8.8 8.8.4.4
 lease 7

ip dhcp pool HQ-SERVERS
 network 10.1.30.0 255.255.255.0
 default-router 10.1.30.1
 dns-server 8.8.8.8 8.8.4.4
 lease 7

end
write memory


enable
configure terminal

! Disable CEF on all VLAN interfaces
interface vlan 10
 no ip route-cache cef
 no ip route-cache
 
interface vlan 20
 no ip route-cache cef
 no ip route-cache

interface vlan 30
 no ip route-cache cef
 no ip route-cache

! Force process switching
no ip cef

end
write memory