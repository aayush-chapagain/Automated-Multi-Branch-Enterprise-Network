hostname B-DSW1
!
no ip domain-lookup
ip routing
!
vlan 10
 name Management
vlan 20
 name Data
vlan 30
 name Servers
vlan 99
 name Native
!
interface Ethernet0/0
 no switchport
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/1
 no switchport
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/2
 no switchport
 ip address 10.3.1.2 255.255.255.252
 no shutdown
 description Uplink-to-B-CR1
!
interface port-channel 1
 no switchport
 ip address 10.3.2.1 255.255.255.252
 no shutdown
 description EtherChannel-to-B-DSW2
!
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-B-ASW1
!
interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-B-ASW2
!
interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-B-ASW3
!
interface Ethernet1/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
 description Trunk-to-B-ASW4
!
interface Vlan10
 ip address 10.3.10.2 255.255.255.0
 no shutdown
 description Management-SVI
 standby version 2
 standby 10 ip 10.3.10.1
 standby 10 priority 110
 standby 10 preempt
!
interface Vlan20
 ip address 10.3.20.2 255.255.255.0
 no shutdown
 description Data-SVI
 standby version 2
 standby 20 ip 10.3.20.1
 standby 20 priority 110
 standby 20 preempt
!
interface Vlan30
 ip address 10.3.30.2 255.255.255.0
 no shutdown
 description Servers-SVI
 standby version 2
 standby 30 ip 10.3.30.1
 standby 30 priority 110
 standby 30 preempt
!
router ospf 1
 router-id 33.33.33.1
 passive-interface Ethernet1/0
 passive-interface Ethernet1/1
 passive-interface Ethernet1/2
 passive-interface Ethernet1/3
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 network 10.3.1.0 0.0.0.3 area 0
 network 10.3.2.0 0.0.0.3 area 0
 network 10.3.10.0 0.0.0.255 area 0
 network 10.3.20.0 0.0.0.255 area 0
 network 10.3.30.0 0.0.0.255 area 0
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 4096
spanning-tree vlan 20 priority 4096
spanning-tree vlan 30 priority 4096
!
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024
!
enable secret cisco123
!
line console 0
 password cisco123
 login
!
line vty 0 4
 login local
 transport input ssh
!
end








enable
configure terminal

ip dhcp excluded-address 10.3.20.1 10.3.20.10
ip dhcp excluded-address 10.3.20.131 10.3.20.254
ip dhcp excluded-address 10.3.30.1 10.3.30.10
ip dhcp excluded-address 10.3.30.131 10.3.30.254

ip dhcp pool BRANCHB-DATA
 network 10.3.20.0 255.255.255.0
 default-router 10.3.20.1
 dns-server 8.8.8.8 8.8.4.4
 lease 7

ip dhcp pool BRANCHB-SERVERS
 network 10.3.30.0 255.255.255.0
 default-router 10.3.30.1
 dns-server 8.8.8.8 8.8.4.4
 lease 7

end
write memory