hostname B-CR1
!
no ip domain-lookup
!
interface Ethernet0/0
 ip address 100.0.4.2 255.255.255.252
 no shutdown
 description WAN-Link-to-ISP004
!
interface Ethernet0/2
 ip address 10.3.1.1 255.255.255.252
 no shutdown
 description Link-to-B-DSW1
!
interface Ethernet0/3
 ip address 10.3.1.5 255.255.255.252
 no shutdown
 description Link-to-B-DSW2
!
interface Ethernet1/0
 ip address 10.0.13.2 255.255.255.252
 no shutdown
 description Leased-Line-to-HQ-CR2
!
router ospf 1
 router-id 44.44.44.44
 passive-interface Ethernet0/0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.3.1.0 0.0.0.3 area 0
 network 10.3.1.4 0.0.0.3 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 100.0.4.1
!
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024
!
enable secret cisco123
!
line console 0
 password cisco123
 login
!
line vty 0 4
 login local
 transport input ssh
!
end