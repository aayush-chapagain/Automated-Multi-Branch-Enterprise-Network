hostname A-CR1
!
no ip domain-lookup
!
interface Ethernet0/0
 ip address 100.0.1.2 255.255.255.252
 no shutdown
 description WAN-Link-to-ISP001
!
interface Ethernet0/2
 ip address 10.2.1.1 255.255.255.252
 no shutdown
 description Link-to-A-DSW1
!
interface Ethernet0/3
 ip address 10.2.1.5 255.255.255.252
 no shutdown
 description Link-to-A-DSW2
!
interface Ethernet1/0
 ip address 10.0.12.2 255.255.255.252
 no shutdown
 description Leased-Line-to-HQ-CR1
!
router ospf 1
 router-id 33.33.33.33
 passive-interface Ethernet0/0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.2.1.0 0.0.0.3 area 0
 network 10.2.1.4 0.0.0.3 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 100.0.1.1
!
ip domain-name enterprise.local
ip ssh version 2
username admin privilege 15 secret cisco123
crypto key generate rsa modulus 1024
!
enable secret cisco123
!
line console 0
 password cisco123
 login
!
line vty 0 4
 login local
 transport input ssh
!
end



! IPsec VPN - Branch A to HQ
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key Enterprise@123 address 100.0.2.2
!
crypto ipsec transform-set TS-ENTERPRISE esp-aes 256 esp-sha256-hmac
 mode tunnel
!
ip access-list extended VPN-BRANCHA-TO-HQ
 permit ip 10.2.0.0 0.0.255.255 10.1.0.0 0.0.255.255
!
crypto map CMAP 10 ipsec-isakmp
 set peer 100.0.2.2
 set transform-set TS-ENTERPRISE
 match address VPN-BRANCHA-TO-HQ
!
interface Ethernet0/0
 crypto map CMAP
!













enable
configure terminal

ip access-list extended NAT-BRANCHA
 permit ip 10.2.0.0 0.0.255.255 any

ip nat inside source list NAT-BRANCHA interface Ethernet0/0 overload

interface Ethernet0/0
 ip nat outside

interface Ethernet0/2
 ip nat inside

interface Ethernet0/3
 ip nat inside

interface Ethernet1/0
 ip nat inside

end
write memory







! ACL - HQ to Branch A
ip access-list extended ACL-FROM-HQ
 permit ip 10.1.0.0 0.0.255.255 10.2.0.0 0.0.255.255
 permit tcp any any established
 deny ip 10.1.20.0 0.0.0.255 10.2.10.0 0.0.0.255
 permit ip any any
!
! ACL - Internet to Branch A
ip access-list extended ACL-FROM-INTERNET
 permit ospf any any
 permit tcp any any established
 permit icmp any any
 permit udp any any eq 500
 permit udp any any eq 4500
 permit esp any any
 deny ip any any log
!
! ACL - Branch A internal
ip access-list extended ACL-BRANCHA-INTERNAL
 deny ip 10.2.20.0 0.0.0.255 10.2.10.0 0.0.0.255
 deny ip 10.2.20.0 0.0.0.255 10.1.10.0 0.0.0.255
 deny ip 10.2.20.0 0.0.0.255 10.3.10.0 0.0.0.255
 deny ip 10.2.0.0 0.0.255.255 10.3.0.0 0.0.255.255
 permit ip any any
!
interface Ethernet1/0
 ip access-group ACL-FROM-HQ in
!
interface Ethernet0/0
 ip access-group ACL-FROM-INTERNET in
!
interface Ethernet0/2
 ip access-group ACL-BRANCHA-INTERNAL in
!
interface Ethernet0/3
 ip access-group ACL-BRANCHA-INTERNAL in
!



