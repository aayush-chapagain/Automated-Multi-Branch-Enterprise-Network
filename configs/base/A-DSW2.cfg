enable
configure terminal

hostname A-DSW2

no ip domain-lookup
ip domain-name enterprise.local

enable secret Enterprise@2026

username admin privilege 15 secret Enterprise@2026

crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

line console 0
 logging synchronous
 exec-timeout 10 0
 login local

line vty 0 4
 exec-timeout 10 0
 login local
 transport input ssh

service timestamps log datetime msec
service timestamps debug datetime msec

no ip http server
no ip http secure-server

end
write memory

