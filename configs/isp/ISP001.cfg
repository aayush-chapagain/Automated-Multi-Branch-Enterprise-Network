enable
configure terminal
hostname ISP001

! Disable DNS lookup
no ip domain-lookup

! Interface toward ISP002 (public WAN)
interface ethernet0/1
 ip address 100.0.12.1 255.255.255.252
 no shutdown
 description Link-to-ISP002

! Interface toward Branch A Core Router
interface ethernet0/0
 ip address 100.0.1.1 255.255.255.252
 no shutdown
 description Link-to-BranchA-ACR1

! OSPF for ISP cloud routing
router ospf 100
 router-id 1.1.1.1
 network 100.0.12.0 0.0.0.3 area 0
 network 100.0.1.0 0.0.0.3 area 0

! Basic security
enable secret cisco123
line console 0
 password cisco123
 login
line vty 0 4
 password cisco123
 login
 transport input ssh telnet

end
write memory