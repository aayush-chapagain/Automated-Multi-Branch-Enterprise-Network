enable
configure terminal
hostname ISP004

no ip domain-lookup

! Interface toward ISP003
interface ethernet0/1
 ip address 100.0.34.2 255.255.255.252
 no shutdown
 description Link-to-ISP003

! Interface toward Branch B Core Router
interface ethernet0/0
 ip address 100.0.4.1 255.255.255.252
 no shutdown
 description Link-to-BranchB-BCR1

router ospf 100
 router-id 4.4.4.4
 network 100.0.34.0 0.0.0.3 area 0
 network 100.0.4.0 0.0.0.3 area 0

enable secret cisco123
line console 0
 password cisco123
 login
line vty 0 4
 password cisco123
 login
 transport input ssh telnet

end
write memory