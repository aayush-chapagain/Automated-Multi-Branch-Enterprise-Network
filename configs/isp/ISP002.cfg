enable
configure terminal
hostname ISP002

no ip domain-lookup

! Interface toward ISP001
interface ethernet0/1
 ip address 100.0.12.2 255.255.255.252
 no shutdown
 description Link-to-ISP001

! Interface toward ISP003
interface ethernet0/0
 ip address 100.0.23.1 255.255.255.252
 no shutdown
 description Link-to-ISP003

! Interface toward HQ-CR1
interface ethernet0/2
 ip address 100.0.2.1 255.255.255.252
 no shutdown
 description Link-to-HQ-CR1

router ospf 100
 router-id 2.2.2.2
 network 100.0.12.0 0.0.0.3 area 0
 network 100.0.23.0 0.0.0.3 area 0
 network 100.0.2.0 0.0.0.3 area 0

enable secret cisco123
line console 0
 password cisco123
 login
line vty 0 4
 password cisco123
 login
 transport input ssh telnet

end
write memory