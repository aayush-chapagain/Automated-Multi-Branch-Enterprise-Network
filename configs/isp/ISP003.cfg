enable
configure terminal
hostname ISP003

no ip domain-lookup

! Interface toward ISP002
interface ethernet0/0
 ip address 100.0.23.2 255.255.255.252
 no shutdown
 description Link-to-ISP002

! Interface toward ISP004
interface ethernet0/1
 ip address 100.0.34.1 255.255.255.252
 no shutdown
 description Link-to-ISP004

! Interface toward HQ-CR2
interface ethernet0/2
 ip address 100.0.3.1 255.255.255.252
 no shutdown
 description Link-to-HQ-CR2

router ospf 100
 router-id 3.3.3.3
 network 100.0.23.0 0.0.0.3 area 0
 network 100.0.34.0 0.0.0.3 area 0
 network 100.0.3.0 0.0.0.3 area 0

enable secret cisco123
line console 0
 password cisco123
 login
line vty 0 4
 password cisco123
 login
 transport input ssh telnet

end
write memory